[project]
name = "autoapply"
version = "0.1.0"
description = "CLI that applies to Summer 2027 internships from the SimplifyJobs list and tracks every attempt."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "playwright>=1.45",
    "anthropic>=0.40",
    "pydantic>=2.7",
    "streamlit>=1.36",
    "pandas>=2.2",
    "pypdf>=4.2",
]

[project.scripts]
autoapply = "autoapply.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
voice = ["sounddevice>=0.4.6", "numpy>=1.26", "faster-whisper>=1.0", "pyttsx3>=2.90"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoapply"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
