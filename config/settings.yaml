# Run behaviour and listing filters.

listings:
  repo_url: https://github.com/SimplifyJobs/Summer2027-Internships
  branch: dev
  local_path: ./data/listings_repo
  json_path: .github/scripts/listings.json   # structured source; README.md is the fallback
  term: "Summer 2027"

filters:
  # Listing categories to include. Valid values in listings.json:
  #   Software, AI/ML/Data, Quant, Hardware, Product
  categories: [Software, "AI/ML/Data", Quant]
  # Optional: title must contain at least one of these (case-insensitive). Empty = any title.
  title_keywords: []
  # Titles containing any of these are skipped.
  exclude_title_keywords: ["PhD", "MBA", "Master's", "Masters", "Graduate Student"]
  # Location substrings to include (case-insensitive). Empty = any location.
  # "Remote" matches remote roles.
  locations: []
  # Companies to never apply to (case-insensitive substring match on company name).
  exclude_companies: []
  # Skip listings whose sponsorship field is one of these.
  exclude_sponsorship: ["U.S. Citizenship is Required"]
  # If set, the listing's degree list must include this (or be empty). Empty string = don't check.
  require_degree: "Bachelor's"
  # Only attempt these ATS types. Others are recorded as needs_manual.
  ats_allowlist: [greenhouse, lever, ashby, smartrecruiters, workday, generic]
  # Hard cap per run (the --limit flag overrides this).
  max_applications_per_run: 10

run:
  headless: false
  # Optional: path to an existing Chrome/Chromium binary. Leave empty to use the
  # browser installed by `playwright install chromium`.
  chromium_executable: ""
  # Random delay between applications, in seconds.
  delay_min_seconds: 20
  delay_max_seconds: 60
  # Per-page timeout in ms.
  page_timeout_ms: 45000
  screenshots_dir: ./data/screenshots
  browser_profile_dir: ./data/browser_profile
  database: ./data/applications.db          # legacy (imported once into the tracker)
  tracker_database: ./data/autoapply.db     # tracker: jobs, applications, events, emails, actions
  logs_dir: ./logs

llm:
  provider: anthropic
  model: claude-opus-5
  # Only accept an inferred answer at this confidence or higher: low | medium | high
  # ("medium" allows reasonable inference from the resume; "high" = explicit facts only)
  min_confidence: medium
  # Max characters of resume text to include as context.
  max_resume_chars: 12000
  # Research the company/role with web search before drafting "why us" answers.
  web_research: true
  research_cache_dir: ./data/research
  # Max characters of the job page text passed as context.
  max_job_text_chars: 8000
  # Fast model for transcript clean-up (dictation). Cheap and low-latency.
  fast_model: claude-haiku-4-5

voice:
  # Web app: the browser captures speech (Web Speech API) and the server cleans it up.
  # Questions are never read aloud. llm_cleanup uses llm.fast_model for punctuation/homophones.
  llm_cleanup: true
  # CLI only (`autoapply run --voice`). Requires: pip install -e ".[voice]"
  tts: off             # auto | pyttsx3 | say (macOS) | off
  stt: faster_whisper  # faster_whisper | off
  whisper_model: base.en
  language: en
  max_record_seconds: 90
  silence_seconds: 2.5
  sample_rate: 16000

email:
  enabled: true
  # Desktop OAuth client JSON from Google Cloud Console (Gmail API, read-only scope).
  google_client_file: ./config/google_oauth_client.json
  poll_interval_seconds: 300
  llm_classification: true
